services:
  - type: web
    name: securevault
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: DATABASE_URL
        value: sqlite:///./securevault.db
      - key: UPLOAD_DIR
        value: uploads
      - key: VIRUSTOTAL_API_KEY
        value: ""